plugins { id 'com.android.application' }

android {
    namespace 'com.bhumikatechai.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.bhumikatechai.app'
        minSdk 21
        targetSdk 36
        versionCode (System.getenv('VERSION_CODE') ?: '1') as int
        versionName '1.0.' + (System.getenv('VERSION_CODE') ?: '1')
    }
    def ks = System.getenv('KEYSTORE_PATH')
    def hasKey = ks != null && new File(ks).length() > 0
    if (hasKey) {
        signingConfigs {
            release {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'bhumika'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (hasKey) { signingConfig signingConfigs.release }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
