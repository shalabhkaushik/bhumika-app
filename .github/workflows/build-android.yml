name: Build Bhumika Tech AI Android app
on:
  push:
    branches: [bhumika-tech-ai-android]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Make icons from the site logo
        run: sudo apt-get install -y imagemagick >/dev/null && ./scripts/make-icons.sh
      - name: Restore signing key
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/bhumika.jks
      - name: Build APK and AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/bhumika.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: bhumika-tech-ai-android
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            store/
            web-icons/
