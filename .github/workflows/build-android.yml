name: Build Bhumika Tech AI Android app
on:
  push:
    branches: [bhumika-tech-ai-android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Make store and web icons
        run: sudo apt-get install -y librsvg2-bin >/dev/null && ./scripts/make-icons.sh
      - name: Build APK and AAB
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/bhumika.jks
            export KEYSTORE_PATH=$RUNNER_TEMP/bhumika.jks
            gradle --no-daemon :app:assembleRelease :app:bundleRelease
          else
            echo "::warning::No signing key secrets yet - building a TEST app only (debug APK)."
            gradle --no-daemon --stacktrace :app:assembleDebug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bhumika-tech-ai-android
          path: |
            app/build/outputs/apk/*/*.apk
            app/build/outputs/bundle/release/*.aab
            store/
            web-icons/
      - name: Publish download on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          cp app/build/outputs/apk/*/*.apk out/BhumikaTechAI-v${{ github.run_number }}.apk
          ls app/build/outputs/bundle/release/*.aab >/dev/null 2>&1 && cp app/build/outputs/bundle/release/*.aab out/BhumikaTechAI-v${{ github.run_number }}.aab || true
          cp store/play-icon-512.png out/ ; cp web-icons/*.png out/
          gh release delete app-latest --yes --cleanup-tag -R ${{ github.repository }} || true
          gh release create app-latest out/* -R ${{ github.repository }} --target ${{ github.sha }} --prerelease \
            --title "Bhumika Tech AI app (build ${{ github.run_number }})" \
            --notes "Open the .apk on an Android phone to install (allow 'install unknown apps'). Icons for the website are included."
